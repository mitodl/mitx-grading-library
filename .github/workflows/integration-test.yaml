name: Integration Test

on:
  pull_request:
    paths:
      - "mitxgraders/**"
      - "voluptuous/**"
      - "course/**"
      - "integration_tests/**"
      - "scripts/python_lib_zip.py"
      - ".github/workflows/integration-test.yaml"
  schedule:
    # Monthly, against the default branch
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edx-platform-integration-test:
    name: Integration with Tutor (${{ matrix.openedx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - openedx: ulmo
            tutor: "tutor>=21,<22"
            codejail: "tutor-contrib-codejail>=21,<22"
          - openedx: verawood
            tutor: "tutor>=22,<23"
            codejail: "tutor-contrib-codejail>=22,<23"
          # Tutor's main branch runs edx-platform master
          - openedx: master
            tutor: "tutor @ git+https://github.com/overhangio/tutor@main"
            codejail: "tutor-contrib-codejail @ git+https://github.com/edunext/tutor-contrib-codejail@nightly"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mitx-grading-library
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # python_lib.zip isn't committed, and the course's MJxPrep.js is a symlink
      # out of course/, so copy the course with links resolved and build the zip in
      - name: Build the demo course
        run: |
          cp -rL mitx-grading-library/course course-build
          python mitx-grading-library/scripts/python_lib_zip.py build -o course-build/static/python_lib.zip
        shell: bash

      - name: Adjust permissions to execute Tutor commands
        run: |
          chmod 777 . -R
        shell: bash

      - name: Set Tutor environment variables
        run: |
          cat <<EOF >> "$GITHUB_ENV"
          LMS_HOST=local.edly.io
          CMS_HOST=studio.local.edly.io
          TUTOR_ROOT=$(pwd)
          COURSE_KEY=course-v1:MITx+grading-library+course
          EOF
        shell: bash

      - name: Install Tutor and the Codejail plugin
        run: pip install "$TUTOR_SPEC" "$CODEJAIL_SPEC"
        shell: bash
        env:
          TUTOR_SPEC: ${{ matrix.tutor }}
          CODEJAIL_SPEC: ${{ matrix.codejail }}

      - name: Enable and initialize the Codejail plugin
        run: |
          tutor plugins enable codejail
          tutor local do init --limit codejail
        shell: bash

      - name: Mount the integration test and the course
        run: |
          tutor mounts add cms:mitx-grading-library/integration_tests/integration_test.py:/openedx/edx-platform/integration_test.py
          tutor mounts add cms:course-build:/openedx/mitx-course
        shell: bash

      - name: Launch Tutor
        run: tutor local launch -I
        shell: bash

      - name: Import the demo course
        run: tutor local run cms python ./manage.py cms import ../data /openedx/mitx-course
        shell: bash

      - name: Run integration tests
        run: |
          tutor local run cms python integration_test.py "$COURSE_KEY"
        shell: bash
