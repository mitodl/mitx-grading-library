name: Unit Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  Python-3-Tests:
    name: Python-3-Tests (${{ matrix.requirements }}, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Open edX codejail sandbox pins
          - requirements: ulmo
            python-version: "3.11"
          - requirements: verawood
            python-version: "3.12"
          - requirements: master
            python-version: "3.12"
          # Unpinned numpy/scipy/pyparsing on newer Pythons
          - requirements: latest
            python-version: "3.13"
          - requirements: latest
            python-version: "3.14"
          - requirements: latest
            python-version: "3.15"
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "requirements-${MATRIX_REQUIREMENTS}.txt"
        env:
          MATRIX_REQUIREMENTS: ${{ matrix.requirements }}

      - name: Run test cases
        run: pytest --cov=mitxgraders --cov-report=term-missing

      - name: Run coverage
        run: codecov

  NodeJS-Tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16]
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd mitxgraders-js
          npm install

      - name: Run test cases
        run: |
          cd mitxgraders-js
          npm test
