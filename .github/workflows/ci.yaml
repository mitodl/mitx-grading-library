name: Unit Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  Python-3-Tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.11]
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" == "3.11" ]; then
            pip install -r requirements-python311.txt
          elif [ "${{ matrix.python-version }}" == "3.8" ]; then
            pip install -r requirements-python38.txt
          fi

      - name: Run test cases
        run: pytest --cov=mitxgraders --cov-report=term-missing

      - name: Run coverage
        run: codecov

  NodeJS-Tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16]
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd mitxgraders-js
          npm install

      - name: Run test cases
        run: |
          cd mitxgraders-js
          npm test

  # Requiring `ci-gate` keeps the list of what must pass in the same file as the jobs it
  # names. integration-test.yaml's edx-platform-integration-test job is schedule-only
  # (monthly cron, no pull_request/push trigger) and must never be required, so it is
  # deliberately left out here -- `needs` cannot cross workflows anyway.
  ci-gate:
    needs: [Python-3-Tests, NodeJS-Tests]
    # Without this the gate is skipped when a dependency fails, and GitHub treats a
    # skipped required job as successful, allowing the PR to merge despite the failure.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate CI result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Read from `needs` rather than naming each job again: adding a job to the list
          # above is then the only edit, which is the entire point of this job. `skipped`
          # passes so that a job legitimately gated behind an `if:` does not wedge the
          # branch; `failure` and `cancelled` do not.
          failed=$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::CI did not succeed: $(echo "$failed" | paste -sd, -)"
            exit 1
          fi
          echo "All CI jobs succeeded."
